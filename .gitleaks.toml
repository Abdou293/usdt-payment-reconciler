# gitleaks configuration: default rules + extra rules for crypto/Telegram secrets.
title = "usdt-payment-reconciler gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b[0-9]{8,10}:[A-Za-z0-9_-]{35}\b'''
keywords = [":"]

[[rules]]
id = "hex-private-key"
description = "Possible 32-byte hex private key (EVM/TRON)"
regex = '''(?i)(?:priv(?:ate)?[_-]?key|secret|mnemonic|seed)["'\s:=]{1,5}(?:0x)?[0-9a-f]{64}\b'''
keywords = ["priv", "secret", "mnemonic", "seed"]

[[rules]]
id = "seed-phrase-assignment"
description = "Possible BIP-39 seed phrase assigned to a variable"
regex = '''(?i)(?:mnemonic|seed[_-]?phrase|recovery[_-]?phrase)["'\s:=]{1,5}["']?(?:[a-z]{3,8}\s+){11,23}[a-z]{3,8}'''
keywords = ["mnemonic", "seed", "recovery"]

[allowlist]
description = "Placeholders in .env.example, and the PUBLIC USDT contract addresses (verified on-chain; not secrets)"
paths = ['''\.env\.example$''']
# Exact public contract addresses only. Each was flagged by generic-api-key
# because it appears in a field named "tokenContract". Nothing broader is allowed.
regexes = [
  '''^TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t$''',
  '''^TXYZopYRdj2D9XRtbG411XZZ3kM5VkAeBf$''',
  '''^0xFd086bC7CD5C481DCC9C85ebE478A1C0b69FCbb9$''',
]
